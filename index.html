<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>月光果園｜翻牌配對</title>
<style>
*{box-sizing:border-box}
:root{color-scheme:dark;font-family:"Microsoft JhengHei",system-ui,sans-serif;color:#f6ecd8;background:#121c1a}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 25% 0%,#304530,transparent 55%),radial-gradient(ellipse at 100% 85%,#3c2b29,transparent 44%)}
main{max-width:1040px;margin:auto;padding:clamp(24px,6vw,85px) clamp(16px,5vw,48px);display:grid;grid-template-columns:minmax(230px,1fr) minmax(0,1.85fr);gap:clamp(28px,6vw,72px);align-items:center;min-height:100vh}
.moon{display:grid;place-items:center;width:54px;height:54px;border-radius:50%;border:1px solid #d9a964;background:#364438;color:#ffd68d;font-size:29px;margin-bottom:24px}
.eyebrow{font-size:.9rem;color:#ffd28d;letter-spacing:.22em;margin:0}
h1{font-family:"Noto Serif TC","PMingLiU",serif;font-weight:900;font-size:clamp(2.6rem,5.7vw,5rem);line-height:1.08;letter-spacing:.06em;margin:12px 0 18px}
.intro{color:#d7dccb;line-height:1.8;margin:0 0 26px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
button{font:inherit;cursor:pointer}
.controls button{background:#25372e;color:#f6ecd8;border:1px solid #68765b;border-radius:100px;padding:8px 12px;font-size:.875rem}
.controls button[aria-pressed=true]{background:#f5d298;color:#263329;border-color:#f5d298;font-weight:700}
#restart{margin-top:16px;background:transparent;border:0;color:#ffda9d;padding:8px 0;text-decoration:underline;text-underline-offset:5px}
.game{padding:clamp(12px,2.8vw,27px);border:1px solid #64705a;border-radius:26px;background:#1c2b24;box-shadow:0 24px 60px #0a110e80}
.stats{margin:0 0 14px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{padding:8px 2px;text-align:center;border-radius:12px;background:#26382e}
dt{color:#d7dccb;font-size:.875rem}dd{margin:4px 0 0;font-size:clamp(1rem,3vw,1.5rem);font-weight:700;color:#ffd998;font-variant-numeric:tabular-nums}
#board{display:grid;grid-template-columns:repeat(var(--columns,4),minmax(0,1fr));gap:clamp(5px,1.25vw,12px)}
.card{border:0;background:none;padding:0;aspect-ratio:1;perspective:500px;border-radius:12px}
.card-inner{display:block;position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .28s}
.card.open .card-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;display:grid;place-items:center;border-radius:inherit;backface-visibility:hidden}
.card-inner{border-radius:inherit}
.back{background:radial-gradient(circle at 35% 25%,#3e6048,#2b4937);border:1px solid #799170;color:#ffdc9e}
.back::before{content:"";position:absolute;inset:10%;border:1px solid #91a48570;border-radius:8px}
.back span{display:grid;place-items:center;width:53%;aspect-ratio:1;border:1px solid #a4aa78;border-radius:50%;font-size:clamp(1rem,3.3vw,2rem)}
.front{transform:rotateY(180deg);background:#f5e3bd;color:#233327;font-size:clamp(1.2rem,4.8vw,3.2rem);border:2px solid #fff0d4}
.card.matched .front{background:#c9dea7;border-color:#e3efca}
.card:not(.open):hover .back{filter:brightness(1.23)}
button:focus-visible{outline:3px solid #ffce79;outline-offset:3px}
.status{min-height:1.5em;margin:14px 0 0;text-align:center;color:#e9e3ca}
@media(max-width:720px){main{grid-template-columns:1fr;max-width:540px;min-height:0}.moon{float:right;margin:0}h1{margin-bottom:8px}.intro{margin-bottom:14px}}
@media(prefers-reduced-motion:reduce){.card-inner{transition:none}}
</style>
<main>
  <header>
    <div class="moon" aria-hidden="true">☾</div>
    <p class="eyebrow">翻牌配對</p>
    <h1>月光果園</h1>
    <p class="intro">每次翻開兩張牌，找出所有相同的水果。</p>
    <div class="controls" role="group" aria-label="遊戲難度">
      <button type="button" data-pairs="4">簡單</button>
      <button type="button" data-pairs="8">普通</button>
      <button type="button" data-pairs="12">挑戰</button>
    </div>
    <button type="button" id="restart">↻ 重新洗牌</button>
  </header>
  <section class="game" aria-label="遊戲區">
    <dl class="stats">
      <div><dt>已配對</dt><dd id="matches"></dd></div>
      <div><dt>嘗試次數</dt><dd id="moves"></dd></div>
      <div><dt>計時</dt><dd id="time"></dd></div>
    </dl>
    <div id="board" role="group" aria-label="牌面"></div>
    <p class="status" id="status" role="status"></p>
  </section>
</main>
<script>
const fruits = [
  ['🍓','草莓'], ['🍋','檸檬'], ['🍇','葡萄'], ['🍑','桃子'],
  ['🍉','西瓜'], ['🍒','櫻桃'], ['🍍','鳳梨'], ['🥝','奇異果'],
  ['🍐','梨子'], ['🫐','藍莓'], ['🍊','橘子'], ['🍏','青蘋果']
];
const board = document.querySelector('#board');
const matches = document.querySelector('#matches');
const moves = document.querySelector('#moves');
const time = document.querySelector('#time');
const status = document.querySelector('#status');
const levels = document.querySelectorAll('[data-pairs]');
let pairs = 8, first, matched, attempts, started, timer, pending;

function shuffle(cards) {
  for (let i = cards.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [cards[i], cards[j]] = [cards[j], cards[i]];
  }
  return cards;
}

function updateTime() {
  const seconds = started === null ? 0 : Math.floor((performance.now() - started) / 1000);
  time.textContent = [Math.floor(seconds / 60), seconds % 60].map(value => String(value).padStart(2, '0')).join(':');
}

function show(card, state) {
  card.classList.toggle('open', state !== 'hidden');
  card.classList.toggle('matched', state === 'matched');
  const label = '第 ' + card.dataset.position + ' 張牌';
  const name = fruits[card.dataset.fruit][1];
  const detail = {hidden:'蓋牌', open:name, matched:name + '，已配對'};
  card.setAttribute('aria-label', label + '，' + detail[state]);
  card.setAttribute('aria-disabled', String(state !== 'hidden'));
}

function flip(card) {
  if (pending !== null || card.classList.contains('open')) return;
  if (started === null) {
    started = performance.now();
    timer = setInterval(updateTime, 250);
  }
  show(card, 'open');
  if (!first) {
    first = card;
    status.textContent = '再翻一張牌';
    return;
  }
  moves.textContent = ++attempts;
  const previous = first;
  first = null;
  if (card.dataset.fruit === previous.dataset.fruit) {
    show(previous, 'matched');
    show(card, 'matched');
    matches.textContent = ++matched + ' / ' + pairs;
    if (matched === pairs) {
      clearInterval(timer);
      updateTime();
      status.textContent = '全部配對！共試了 ' + attempts + ' 次，用時 ' + time.textContent + '。';
    } else {
      status.textContent = '配對成功！';
    }
    return;
  }
  status.textContent = '再試一次';
  pending = setTimeout(() => {
    show(previous, 'hidden');
    show(card, 'hidden');
    pending = null;
  }, 850);
}

function reset() {
  clearInterval(timer);
  clearTimeout(pending);
  first = pending = started = null;
  matched = attempts = 0;
  matches.textContent = '0 / ' + pairs;
  moves.textContent = '0';
  updateTime();
  status.textContent = '翻開任意一張牌';
  levels.forEach(level => level.setAttribute('aria-pressed', String(Number(level.dataset.pairs) === pairs)));
  board.style.setProperty('--columns', pairs === 12 ? '6' : '4');
  const selected = shuffle(fruits.map((_, index) => index)).slice(0, pairs);
  const cards = shuffle([...selected, ...selected]).map((fruit, index) => {
    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'card';
    card.dataset.fruit = fruit;
    card.dataset.position = index + 1;
    card.innerHTML = '<span class="card-inner" aria-hidden="true"><span class="face back"><span>✦</span></span><span class="face front">' + fruits[fruit][0] + '</span></span>';
    show(card, 'hidden');
    card.addEventListener('click', () => flip(card));
    return card;
  });
  board.replaceChildren(...cards);
}

levels.forEach(level => level.addEventListener('click', () => {
  pairs = Number(level.dataset.pairs);
  reset();
}));
document.querySelector('#restart').addEventListener('click', reset);
reset();
</script>
</html>
